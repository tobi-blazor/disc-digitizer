; Comskip-Einstellungen für umwandeln.py (DVD-Digitalisierung)
; Aufruf durch umwandeln.py: comskip --ini=<diese Datei> --output=<Temp-Ordner> --quiet <Quelle>
; Ausgabe nur die EDL-Datei (Sekunden Start/Ende je Werbeblock), umwandeln.py macht daraus
; Kapitel "Werbung" im MKV und titel[].werbung in disc.json. Temp-Ordner wird danach gelöscht.
; Nicht aufgeführte Werte: Comskip-Voreinstellung (siehe comskip.txt im Programmordner).

; Erkennung: 1 Schwarzbild + 2 Senderlogo + 8 Auflösungswechsel + 32 Seitenverhältnis = 43
; (Voreinstellung der mitgelieferten comskip.ini, für SD-Aufnahmen aus DVB-T/Kabel üblich)
detect_method=43
verbose=0
thread_count=2

; Werbeblock: mindestens 25 s, höchstens 10 min; einzelner Spot 4..125 s
min_commercialbreak=25
max_commercialbreak=600
min_commercial_size=4
max_commercial_size=125
min_show_segment_length=250
max_avg_brightness=25
max_brightness=60
test_brightness=40
max_volume=500
min_silence=12
non_uniformity=500
validate_silence=1
validate_uniform=1
validate_scenechange=1
punish_no_logo=1
connect_blocks_with_logo=1
cut_on_ar_change=1
; USA-spezifische Helligkeitsabstimmung aus
intelligent_brightness=0
max_repair_size=200
disable_heuristics=4

; Ausgabe: nur EDL, keine .txt/.log/.logo.txt-Reste
output_default=0
output_edl=1
output_framearray=0
output_data=0
output_demux=0
output_debugwindow=0
output_timing=0
delete_logo_file=1
live_tv=0
